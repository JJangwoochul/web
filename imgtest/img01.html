<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>이미지</title>
  </head>
  <body>
    <!-- 설명글을 붙일 대상 태그-->
    <figure>
      <!-- img 파일에 dog.jpg를 가져옴-->
      <!-- alt속성으로 이미지가 안나올때 대체 텍스트 (필수)-->
      <img src="img/dog.jpg" alt="바쁘다멍" />
      <!-- 설명글-->
      <figcaption>강아지</figcaption>
      <img src="img/cat.jpg" width="300" height="250" alt="바쁘다냥" />
      <figcaption>고양이</figcaption>
    </figure>
  </body>
</html>
