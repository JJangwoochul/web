  <body>
    <!-- a 태그 -> 링크만들때 사용 href 속성으로 주소 저장-->

    <hr />
    <!--a href로 클릭시 test09.html파일이 나오게함-->
    <!-- 이미지파일에서 cat이미지를 가져와 사진을 클릭했을 시 href 실행-->

      <img src="img/cat.jpg" alt="로고" />
    </a>
  </body>
