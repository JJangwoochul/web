<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>
            앵커[한 페이지 안에서 점프]

    <body>

        <hr>
        <p>
            <h2 id="cutedog">

        <hr>
        <h2 id="content2">
            내용 2 섹션
        </h2>
        <hr>
        <!-- href 로 id가 content2인 곳으로 바로 이동 # = id -->
        <a href="#content2">
            [내용 2로 바로 이동하기]
        </a>
        <hr>
        <a href="#menu">
            [메뉴로 돌아가기]
        </a>
        <hr>
        <a href="#cutedog">
            [사진으로 바로가기]
        </a>

</html>
