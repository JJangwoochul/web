<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script>
      $(function () {
        $(".btn1").on("click", function (e) {
          e.preventDefault();
          $(".tx1").css({ "background-color": "#ff0" });
        });
        $(".btn2").on("click", function (e) {
          $("tx2").css({ "background-color": "#0ff" });
        });
        $(".btn3").on("dblclick", function (e) {
          $(".tx3").css({ "background-color": "#0f0" });
        });
      });
    </script>
  </head>
  <body>
    <p><a href="http://www.easyspub.co.kr/" class="btn1">버튼1</a></p>
    <p class="tx1">내용1</p>
    <p><a href="http://www.easyspub.co.kr/" class="btn2">버튼2</a></p>
    <p class="tx2">내용2</p>
    <p><button class="btn3">버튼3</button></p>
    <p class="tx3">내용3</p>
  </body>
</html>
