<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function ranData() {
            var date = new Date();
            var x = date.getSeconds();
            var y = (x % 5) +1;
            alert("난수 = "+ y);
        }
    </script>
</head>
<body>
    <a href="#" onclick="ranData()">난수 발생시키기</a>
</body>
</html>
