<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      var rightId = "ehtm";
      var rightPw = "1234";
      function login() {
        if (fom.id.value == rightId) {
          if (fom.pwd.value == rightPw) {
            document.write(fom.id.value + "님 방문을 환영합니다.");
          } else {
            alert("잘못된 비밀번호입니다.");
          }
        } else {
          alert("존재하지 않는 아이디입니다.");
          location.reload();
        }
      }
    </script>
  </head>
  <body>
    <form name="fom">
      <fieldset>
        <h1 style="text-align: center">회원 가입창</h1>
        <table>
          <tr>
            <td width="200">아이디</td>
            <td width="400">
              <input type="text" name="id" />
            </td>
          </tr>
          <tr>
            <td width="200">비밀번호</td>
            <td width="400">
              <input type="password" name="pwd" />
            </td>
          </tr>
          <tr>
            <td width="200">로그인</td>
            <td width="400">
              <input type="submit" value="로그인하기" onclick="login()" />
            </td>
          </tr>
        </table>
      </fieldset>
    </form>
  </body>
</html>
