<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrapper {
            width: 500px;
            height: 150px;
            margin: 0px auto 20px;
            display: flex;
            flex-wrap: wrap;
            border: 1px solid black;
        }
        #container1 {
            align-content: flex-start;
        }
        #container2 {
            align-content: flex-end;
        }
        #container3 {
            align-content: center;
        }
        #container4 {
            align-content: space-between;
        }
        #container5 {
            align-content: space-around;
        }
        .wrapper div {
            width: 200px;
            border: 2px solid black;
            background: gray;
        }
        h1 {
            text-align: center;
        }
        p {
            font-weight: bold;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>flex-start</h1>
    <div id="container1" class="wrapper">
        <div><p>1</p></div>
        <div><p>2</p></div>
        <div><p>3</p></div>
    </div>
    <h1>flex-end</h1>
    <div id="container2" class="wrapper">
        <div><p>1</p></div>
        <div><p>2</p></div>
        <div><p>3</p></div>
    </div>
    <h1>center</h1>
    <div id="container3" class="wrapper">
        <div><p>1</p></div>
        <div><p>2</p></div>
        <div><p>3</p></div>
    </div>
    <h1>space-between</h1>
    <div id="container4" class="wrapper">
        <div><p>1</p></div>
        <div><p>2</p></div>
        <div><p>3</p></div>
    </div>
    <h1>space-around</h1>
    <div id="container5" class="wrapper">
        <div><p>1</p></div>
        <div><p>2</p></div>
        <div><p>3</p></div>
    </div>
</body>
</html>
