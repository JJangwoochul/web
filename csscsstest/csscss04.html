<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 이미지 파일 가져옴, no-repeat center->반복x(사진이 중앙에 한번만 나옴)*/
        /* contain  */
        .card-bg {
            background: yellow url(../img/cat.jpg) 
            no-repeat center / contain ;
        }
    </style>
</head>
<body>
    <div class="card-bg">
        <p> 배경 정보가 축약 적용됨</p>
    </div>
</body>
</html>
