<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 박스 사이징->모든 박스를 보더로 바꿈(박스크기 계산 편함)*/
      * {
        box-sizing: border-box;
      }
      /* 보더박스 기준이니 가로 세로 크기 그대로 적용*/
      #Bigbox {
        width: 200px;
        height: 100px;
        margin: 30px;
      }
      /*display 인라인 블럭으로 한줄에 나오게 만듦*/
      #Smallbox {
        width: 200px;
        height: 100px;
        margin: 30px;
        display: inline-block;
      }
      .box1 {
        background: blue;
      }
      .box2 {
        background: red;
      }
      .box3 {
        background: green;
      }
      .box4 {
        background: blue;
      }
      .box5 {
        background: red;
      }
      .box6 {
        background: green;
      }
    </style>
  </head>
  <body>
    <div id="Bigbox" class="box1"></div>
    <div id="Bigbox" class="box2"></div>
    <div id="Bigbox" class="box3"></div>
    <div id="Smallbox" class="box4"></div>
    <div id="Smallbox" class="box5"></div>
    <div id="Smallbox" class="box6"></div>
  </body>
</html>
