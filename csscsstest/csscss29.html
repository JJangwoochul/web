<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul.navi li {
            list-style-type: none; /*불릿기호 삭제*/
            display: block; /*블럭영역 생성*/
            width: 8em; /*넓이*/
            height: 3em; /*높이*/
            float: left; /*왼쪽 플로팅*/
            text-align: center; /*가운데 정렬*/
            font-family: "Lucida Grande", sans-serif; /*글꼴*/
            border: 1px solid black;    /*테두리*/
            box-shadow: 1px 1px 1px gray; /*박스 그림자*/
        }
        ul.navi li a {
            display: block; /*영역 생성*/
            padding: .8em .5em .5em .5em; /*내부 여백*/
            text-decoration: none; /*밑줄 삭제*/
            color: black;   /*글자 색*/
            text-shadow: 1px 1px 0px; /*텍스트 그림자*/
        }
        /*마우스를 위에 올릴때*/
        ul.navi li:hover {
            background-color: black; /*배경*/
        }
        /*마우스를 위에 올린 다음*/
        ul.navi li:hover>a {
            color: white;
            text-shadow: 0px 1px 0px white;
        }
        /*첫번째 항목 스타일*/
        ul.navi li:first-child {
            border-top-left-radius: 1em; /*좌측 상단*/
            border-bottom-left-radius: 1em; /*좌측 하단*/
        }
        /*마지막 항목 스타일*/
        ul.navi li:last-child {
            border-top-right-radius: 1em; /*우측 상단*/
            border-bottom-right-radius: 1em; /*우측 하단*/
        }
    </style>
</head>
<body>
    <div>
        <ul class="navi">
            <li id="home"><a href="#">Home</a></li>
            <li id="html"><a href="#">HTML5</a></li>
            <li id="css"><a href="#">CSS3</a></li>
            <li id="jquery"><a href="#">JQuery</a></li>
        </ul>
    </div>
</body>
</html>
