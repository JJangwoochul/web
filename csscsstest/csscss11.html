<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*float left -> 왼쪽 배치*/
        /*float right -> 오른쪽 배치*/
        .box1 {
            padding: 20px;
            margin-right: 10px;
            background: yellow;
            float: left;
        }
        .box2 {
            padding: 20px;
            margin-right: 10px;
            background: blue;
            float: left;
        }
        .box3 {
            padding: 20px;
            background: green;
            margin-left: 10px;
            float: right;
        }
        /*solid 점선*/
        .box4 {
            padding: 20px;
            background: white;
            float: right;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="box1">박스1</div>
    <div class="box2">박스2</div>
    <div class="box3">박스3</div>
    <div class="box4">박스4</div>
</body>
</html>
