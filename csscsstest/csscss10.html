<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        /* float left -> 사진을 왼쪽으로 배치*/
        .left-img {
            float: left;
            margin-right: 25px;
        }
        p {line-height: 30px;}
    </style>
</head>
<body>
    <!-- div 안에 모든 글과 사진이 있지만, float left 처리를 해서 사진이 왼쪽-->
    <!-- 나머지 h1,h2,p 컨텐츠는 같은 컨텐츠 안에 사진오른쪽에 나옴-->
    <div id="container">
        <img src="../img/cat.jpg" class="left-img"   alt="">
        <h1>바쁜 3,4학년을 위한 빠른 분수</h1>
        <h2>3,4학년이 꼭 알아야 할 분수를 한 권에 모았어요!</h2>
        <p>한귝 교육과정평가원이 최근 발표한 보고에서 따르면
            ㅁㄴㅇㅁㄴㅇㅁㄴㅇ
            ㅁㄴㅇㅁㄴㅇㅁㄴㅇㅁㄴㅇ
            ㅁㄴㅇㅁㄴㅇㅁㄴㅇㅁㄴㅇㅁㄴㅇ
            ㅁㄴㅇㅁㄴㅇㅁㄴㅇㅁㄴㅇㅁㄴㅇㅁㄴㅇ
        </p>
    </div>
</body>
</html>
