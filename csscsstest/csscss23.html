<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table,
      td {
        border: 1px solid black;
      }
      td {
        width: 200px;
        height: 100px;
        padding: 20px;
      }
      .va1 {
        vertical-align: top;
        text-align: left;
      }
      .va2 {
        vertical-align: bottom;
        text-align: center;
      }
      .va3 {
        vertical-align: middle;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <table>
      <caption>
        vertical-alignment
      </caption>
      <tr>
        <td class="va1">vertical-alignment</td>
        <td class="va2">vertical-alignment</td>
        <td class="va3">vertical-alignment</td>
      </tr>
    </table>
  </body>
</html>
