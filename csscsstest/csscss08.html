<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 보더// dashed->점선,double->이중선,solid->실선*/
        .border-dashed { border: 2px dashed black; width: 86px;}
        .border-double { border: 4px double greenyellow;}
        .profile-ing { width: 100px; height: 100px;
        border-radius: 50px 30px 20px 10px;}
        /* 보더는 왼쪽 상단기준 시계방향*/
        /* img클래스 사진크기 조정 , radius 사진 외곽 각도조정(원 만들기)*/
    </style>
</head>
<body>
    <div class="border-dashed">점선 테두리</div>    
    <button class="border-double">이중선 버튼</button>
    <img src="../img/cat.jpg" class="profile-ing" alt="고양이">
</body>
</html>
