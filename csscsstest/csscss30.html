<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        .container {
            width: 960px;
            margin: 0 auto;
        }
        ul li {
            list-style-type: none;
            margin: 15px;
        }
        li.hot::after {
            content: "NEW! !";
            font-size: x-small;
            padding: 4px 4px;
            margin: 0 10px;
            border-radius: 2px;
            background: red;
            color: white;
        }
        li.old::before {
            content: "Old..";
            font-size: x-small;
            padding: 4px 4px;
            margin: 0 10px;
            border-radius: 2px;
            background: blue;
            color: white;
        }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>제품 목록</h1>
      <ul>
        <li class="hot">제품 A</li>
        <li class="old">제품 B</li>
        <li class="old">제품 C</li>
        <li class="hot">제품 D</li>
      </ul>
    </div>
  </body>
</html>
