<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      a {
        color: green;
        text-decoration: none;
      }
      .del {
        text-decoration: line-through;
      }
      h1 {
        text-shadow: 2px 2px 4px#000;
      }
      p {
        text-align: justify;
        line-height: 1.8;
        text-indent: 1em;
      }
    </style>
  </head>
  <body>
    <a href="#">밑줄없는 링크</a>
    <span class="del">취소선 택스트</span>
    <h1>입체감 있는 제목</h1>
    <p>양쪽 정렬과 줄 간격이 적용된 긴 문장<br>입니다.</p>
  </body>
</html>
