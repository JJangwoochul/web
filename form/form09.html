<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>버튼,파일전송</title>
  </head>

  <body>
    <form>
      <fieldset>
        <legend>데이터전송</legend>
        <label>
          회원가입
          <!-- 데이터 전송 버튼-->
          <input type="submit" value="회원가입" />
        </label>
        <br />
        <label>
          다시입력
          <!--데이터 초기화 버튼-->
          <input type="reset" value="다시 입력" />
        </label>
        <br />
        <label>
          중복확인
          <!-- 일반 버튼 -->
          <input type="button" value="중복 확인" />
        </label>
        <br />
        <label>
          파일선택
          <!-- 파일 첨부 버튼(클릭시 파일)-->
          <input type="file" />
        </label>
        <br />
        <label>
          사진선택
          <!-- 이미지 버튼 사진 클릭-->
          <input type="image" src="img/cat.jpg" alt="제출" />
        </label>
      </fieldset>
    </form>
  </body>
</html>
