<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>폼 만들기</title>
  </head>

  <body>
    <!-- 1번 폼-->
    <form
      action="register.jsp"
      method="post"
      name="member01_form"
      target="_blank"
    >
      <p>id를 입력하세요</p>
      <input type="text" name="userid" />
      <input type="submit" value="가입" />
    </form>
    <br />
    <hr />
    <br />

    <!--2번 폼-->
    <form
      action="register.jsp"
      method="post"
      name="member02_form"
      target="_blank"
    >
      <fieldset>
        <legend>
          개인 정보
          <hr />
          <label for="userid"> 아이디(6자 이상) </label>
          <input type="text" id="userid" />
          <input type="submit" value="로그인" />
        </legend>
      </fieldset>
    </form>
    <br />
    <hr />
    <br />
    <!-- 3번 폼-->
    <form action="register.jsp" method="post" name="member03_form">
      <!--3번폼의 1번 필드-->
      <fieldset>
        <!-- 1번 필드의 제목 개인정보 묶음-->
        <legend>개인 정보</legend>
        <!-- 1번필드의 첫번째 라벨-->
        <label for="name"> 이름 </label>
        <input type="text" id="user_name" />
        <br />
        <!-- 1번 필드의 두번째 라벨-->
        <label for="mail"> 메일 주소 </label>
        <input type="text" id="user_mail" />
      </fieldset>
      <!-- 3번폼의 2번 필드-->
      <fieldset>
        <!-- 2번 필드의 제목 로그인 정보-->
        <legend>로그인 정보</legend>
        <!-- 2번 필드의 첫번째 라벨-->
        <label for="login"> 아이디 </label>
        <input type="text" id="user_id" size="10" maxlength="15" />
        <br />
        <!-- 2번 필드의 두번째 라벨-->
        <label for="password"> 비밀번호 </label>
        <input type="password" id="uesr_password" />
      </fieldset>
    </form>
    <br />
    <hr />
    <br />
    <!--4번 폼-->
    <form>
      <input type="text" name="a_name" size="10" maxlength="15" />
      <input type="password" name="a_password" />
      <input type="hidden" name="admin_code" value="A001" />
    </form>
    <br />
    <hr />
    <br />
    <!--5번 폼-->
    <form action="register.jsp" method="post" name="member05_form">
      <fieldset>
        <legend>회원가입</legend>
        <br />
        <label for="name_form">
          이름:
          <br />
          <input type="text" name="form_name" id="name" />
        </label>
        <br /><br />
        <label for="password_form">
          패스워드:
          <br />
          <input type="password" name="form_password" />
        </label>
        <br /><br />
        <label for="mail_form">
          이메일:
          <br />
          <input type="email" name="form_email" id="mail" />
        </label>
        <br /><br />
        <label for="number_form">
          전화번호:
          <br />
          <input type="tel" name="form_phone" id="phone" />
        </label>
        <br /><br />
        <label for="url_form">
          주소:
          <br />
          <input type="url" name="form_homepahe" id="homepage" />
        </label>
        <hr />
        <input type="submit" value="가입하기" />
        <input type="submit" value="초기화" />
      </fieldset>
    </form>
    <br />
    <hr />
    <br />
    <!-- 6번 폼-->
    <form action="Radio_checkbox" method="get" enctype="UTF-8">
      <fieldset>
        <legend>신청과목</legend>
        <p>이 달에 신청할 과목을 선택하세요(1과목만 가능)</p>
        <label>
          <input type="radio" name="subject" value="회화" />
          회화
        </label>
        <label>
          <input type="radio" name="subject" value="문법" />
          문법
        </label>
        <label>
          <input type="radio" name="subject" value="문법" />
          문법
        </label>
      </fieldset>
      <fieldset>
        <legend>메일 수신</legend>
        <p>메일로 받고 싶은 뉴스 주제를 선택해 주세요(복수 가능)</p>
        <label>
          <input type="checkbox" name="mailing" value="해외 단신" />
          해회 단신
        </label>
        <label>
          <input type="checkbox" name="mailing" value="5분 회화" />
          5분 회화
        </label>
        <label>
          <input type="checkbox" name="mailing" value="모닝팝스" />
          모닝팝스
        </label>
      </fieldset>
      <input type="submit" value="신청하기" />
    </form>
    <br />
    <hr />
    <br />
    <!-- 7번 폼-->
    <form action="regist.jsp" method="post" name="number07_form">
      <input type="number" min="1" max="31" step="1" />
      <input type="range" min="1" max="10" value="5" />
      <input type="date" />
      <input type="month" />
      <input type="color" value="#00ff00" />
    </form>
    <br />
    <hr />
    <br />
    <!-- 8번 폼-->
    <form action="regist.jsp" method="get" name="number08_form">
      <h1>숙박기간 선택</h1>

      <span style="color: blue"> 시작 : </span>
      <input type="date" />
      <span style="color: blue"> 종료 : </span>
      <input type="date" />
      <input type="submit" value="제출" />
    </form>
    <br />
    <hr />
    <br />
    <!-- 9번 폼-->
    <form>
      <fieldset>
        <legend>데이터전송</legend>
        <label>
          회원가입
          <input type="submit" value="회원가입" />
        </label>
        <br />
        <label>
          다시입력
          <input type="reset" value="다시 입력" />
        </label>
        <br />
        <label>
          중복확인
          <input type="button" value="중복 확인" />
        </label>
        <br />
        <label>
          파일선택
          <input type="  " />
        </label>
        <br />
        <label>
          사진선택
          <input type="image" src="img/cat.jpg" alt="제출" />
        </label>
      </fieldset>
    </form>
    <br />
    <hr />
    <br />
    <!--10번 폼-->
    <form>
      <fieldset>
        <legend>회원가입</legend>
        <label>
          작성
          <input type="text" autofocus required />
        </label>
        <br />
        <label>
          번호입력
          <input type="tel" placeholder="하이픈(-) 없이 입력" required />
        </label>
        <br />
        <label>
          <input type="text" value="admin" readonly />
        </label>
        <br />
        <label>
          이메일 입력
          <input type="email" required />
        </label>
        <input type="submit" value="제출하기" />
      </fieldset>
    </form>
    <br />
    <hr />
    <br />
    <!-- 11번 폼-->
    <form>
      <fieldset>
        <legend>데이터나열</legend>
        <label>
          학과선택
          <select id="class">
            <optgroup label="공과대학">
              <option value="archi">건축공학과</option>
              <option value="comp" selected>컴퓨터공학과</option>
            </optgroup>
          </select>
        </label>
        <label>
          브라우저
          <input type="text" list="browsers" />
          <datalist id="browsers">
            <option value="Chrome"></option>
            <option value="Safari"></option>
            <option value="Edge"></option>
          </datalist>
        </label>
      </fieldset>
    </form>
    <br />
    <hr />
    <br />
    <!-- 12번 폼-->
    <form>
      <fieldset>
        <legend>메모작성</legend>
        <label>
          <textarea name="memo" cols="50" rows="5">
            메모를 남겨주세요.
            </textarea
          >
        </label>
        <label>
          <meter min="0" max="100" value="64"></meter>
        </label>
        <label>
          <progress value="50" max="100"></progress>
        </label>
      </fieldset>
    </form>
    <br />
    <hr />
    <br />
  </body>
</html>
