<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>text,password,hidden타입 생성</title>
  </head>

  <body>
    <form>
      <!-- text 타입 ,사이즈로 화면길이를 조정하고 , 최대15글자수 제한-->
      <input type="text" name="a_name" size="10" maxlength="15" />
      <input type="password" name="a_password" />
      <!-- hidden 타입 ,사용자는 안보이는 창 관리자만 보임-->
      <input type="hidden" name="admin_code" value="A001" />
    </form>
  </body>
</html>
