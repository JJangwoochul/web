<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>여러개의 필드 생성</title>
  </head>

  <body>
    <form action="register.jsp" method="post" name="member03_form">
      <!--3번폼의 1번 필드-->
      <fieldset>
        <!-- 1번 필드의 제목 개인정보 묶음(1번필드의 가장 큰 틀)-->
        <legend>개인 정보</legend>
        <!-- 1번필드의 첫번째 레이블 , 입력창 설명-->
        <label for="name"> 이름 </label>
        <!-- 입력창 text-> 유저가 보이는 글-->
        <input type="text" id="user_name" />
        <br />
        <!-- 1번 필드의 두번째 레이블-->
        <label for="mail"> 메일 주소 </label>
        <input type="text" id="user_mail" />
      </fieldset>
      <!-- 3번폼의 2번 필드-->
      <fieldset>
        <!-- 2번 필드의 제목 로그인 정보(2번 필드의 가장 큰 틀)-->
        <legend>로그인 정보</legend>
        <!-- 2번 필드의 첫번째 레이블 -->
        <label for="login"> 아이디 </label>
        <input type="text" id="user_id" size="10" maxlength="15" />
        <br />
        <!-- 2번 필드의 두번째 레이블 -->
        <label for="password"> 비밀번호 </label>
        <!-- 패스워드 타입 -> 유저가 password에 글을 적은 내용은 안보임-->
        <input type="password" id="uesr_password" />
      </fieldset>
    </form>
  </body>
</html>
