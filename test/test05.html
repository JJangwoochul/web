<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>
            인용,글자색(형광),영역묶기
        </title>
    </head>
    <body>
        <p>
            <!-- 줄바꿈 없음 , q안에는 ""추가-->
            <q>
                줄바꿈 없이 한줄로 표시
            </q>
            <q>
                줄바꿈 없음
            </q>
            <!-- 글자를 형광색 색칠 함-->
            <q>
            <mark>
                형광색
            </mark>
            </q>
        </p>
        <div> <!-- 대표 블럭 -->
            안녕하세요
            장우철입니다
            <span> <!-- 대표적인 인라인-->
                줄 안에서 인라인으로 묶이기
            </span>
            <div>
            ㅁㄴㅇ
            </div> 
        <!-- div-->
        </div> <!-- 줄을 바꿔 하나의 독립된 블록으로 묶을떄-->
        <p>
                안녕하세요
            <div>
                장우철입니다
            </div>
            <div>
                줄 안에서 블럭으로 묶이기
            </div>
        </p>
    </body>
</html>
