<!-- html 테스트 확인용-->
<!DOCTYPE html>
<!--최신 표준 html5 문서 -->
<html lang="ko">
  <!-- html 언어 = korea -->
  <head>
    <!-- html 필수 영역 -->
    <meta charset="utf-8" />
    <!-- 문자 인코딩 -->
    <title>html 테스트 확인용</title>
  </head>
  <body>
    <!-- html 필수 영역 -->
    <h1>
      <!-- h는 1~6번까지 가능 , h1~h6까지 크기차이-->
      안녕하세요
    </h1>
    <h6>안녕하세요</h6>
    <p>26살 장우철 입니다</p>
  </body>
</html>
