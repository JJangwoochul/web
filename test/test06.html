<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>리스트내용</title>
  </head>
  <body>
    <!-- 순서없는 리스트 목록 (블럭)-->
    <ul>
      <li>불릿기호 1 불릿기호 2</li>
      <li>불릿기호 3</li>
    </ul>
    <!-- 순서가 있는목록 ex)1,3 = 숫자3부터 리스트 , a,2 = 소문자b부터 리스트-->
    <ol type="a" start="3">
      <li>1 2 3 4 5 6 7</li>
      <li>2</li>
    </ol>
  </body>
</html>
