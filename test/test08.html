<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>표</title>
  </head>
  <body>
    <!-- 테이블 표-->
    <figure>
      <figcaption>표 제목</figcaption>
      <table border="1">
        <!-- 큼직한 테이블 갯수 border이 없으면 선x-->
        <!-- <table ="1"> 선 없는 표 예시 -->
        <tr>
          <!-- 테이블 1행-->
          <th>
            <!-- th는 제목(글자가 두꺼움)-->
            이름
          </th>
          <th>번호</th>
          <th>사는곳</th>
        </tr>

        <tr>
          <!-- 테이블 2행-->
          <td>
            <!-- 내용 -->
            장우철
          </td>
          <td>
            <!-- td , th는 각각 셀 한칸 차지-->
            01012341234
          </td>
          <td>대전 유성구</td>
        </tr>

        <tr>
          <!-- 테이블 3행-->
          <td>장우성</td>
          <td>01012345678</td>
          <td>
            강원도
            <br />
            속초
          </td>
        </tr>
      </table>
    </figure>
    <br />
    <br />
    <br />
    <!-- 2번쨰 테이블-->
    <!--셀 병합 (세로row , 가로col)-->
    <figure>
      <table border="1">
        <caption>
          중앙 고정 제목
          <!-- figcaption=왼쪽 고정 제목-->
          <!-- caption = 중앙 고정 제목-->
        </caption>
        <tr>
          <!-- 테이블 1행-->
          <td>1</td>
          <td>2</td>
          <td>3</td>
          <td>4</td>
          <td>5</td>
          <td>6</td>
        </tr>

        <tr>
          <!-- 테이블 2행-->
          <td>7</td>
          <td>8</td>
          <td>9</td>
          <td>10</td>
          <td>11</td>
          <td>12</td>
        </tr>
        <!-- 테이블 3행-->
        <tr>
          <td>13</td>
          <td>14</td>
          <td rowspan="2">
            <!-- 3행의 3번째 열 세로 조합-->
            15
            <br />
            21
          </td>

          <td colspan="3">
            <!-- 3행의 4번째열~6번째열 가로 조합-->
            16,17,18
          </td>
        </tr>
        <!-- 테이블 4행-->
        <tr>
          <td>19</td>
          <td>20</td>
          <td>22</td>
          <td>23</td>
          <td>24</td>
        </tr>
      </table>
    </figure>
    <!--3번째 테이블-->
    <table border="1">
      <thead>
        <tr>
          <th>제목</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>본문 데이터1</td>
          <td>
            본문 데이터2
            <br />
            본문 데이터3
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th>1234</th>
        </tr>
      </tfoot>
    </table>
    <!--4번째 테이블-->
    <table border="1">
      <caption>
        colgroup 연습
      </caption>
      <colgroup>
        <col />
        <col span="2" style="background-color: blue" />
        <col style="background-color: greenyellow" />
      </colgroup>
      <tr>
        <td>데이터1</td>
        <td>데이터2</td>
        <td>데이터3</td>
        <td>데이터4</td>
      </tr>
      <tr>
        <td>데이터5</td>
        <td>데이터6</td>
        <td>데이터7</td>
        <td>데이터8</td>
      </tr>
    </table>
  </body>
</html>
