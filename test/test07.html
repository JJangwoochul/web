<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>제목,설명</title>
  </head>
  <body>
    <!-- 설명 목록-->
    <dl>
      <!-- 제목(큼직하게 설명)-->
      <dt>올레1코스 (제목)</dt>
      <!-- 설명(dd)-->
      <dd>코스 : 시흥초 옆 (설명1)</dd>
      <dd>11시까지 도착 (설명2)</dd>
    </dl>
    <!-- 예시1-->
    <dl>
      <!-- dd만 있을떈 설명만-->
      <dd>올레1코스 (제목)</dd>
      <dd>코스 : 시흥초 옆(설명1)</dd>
      <dd>11시까지 도착(설명2)</dd>
    </dl>
    <!-- 예시2-->
    <dl>
      <!-- dt만 있을땐 제목만 (일반 p 랑 다른점 x)-->
      <dt>제목1</dt>
      <dt>제목2</dt>
    </dl>
  </body>
</html>
