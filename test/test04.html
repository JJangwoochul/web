<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>내용강조,인라인블록</title>
  </head>
  <body>
    <p>
      <!-- strong , b 둘 다 글자를 굵게 만듦 , 블럭-->
      <strong> 중요내용강조 </strong>
      <b> 단순히 굵게 표시 ㅁㄴㅇ </b>
    </p>
    <p>
      <!-- 이탤릭체 -->
      <em> 흐름상 강조 </em>
      <i> 단순 이탤릭체 </i>
      안녕하세요(차이점 보기용)
    </p>
  </body>
</html>
